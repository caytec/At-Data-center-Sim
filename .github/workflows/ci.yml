name: CI

# Free automated testing on every push and PR: runs the economics-engine golden
# tests, the production build, and the server typecheck. Works on private repos
# within the free GitHub Actions minutes.

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine golden tests
        run: npm test -w web

      - name: Production build (PWA)
        run: npm run build -w web

      - name: Server typecheck
        run: npm run typecheck -w server
