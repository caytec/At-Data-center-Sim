name: Deploy PWA to GitHub Pages

# Builds the GigaRack web app and deploys it to GitHub Pages using GitHub's
# official Actions flow, which enables Pages via the workflow token (no manual
# Settings toggle). Live at https://caytec.github.io/At-Data-center-Sim/
#
# NOTE: GitHub Pages requires the repo to be PUBLIC (or on a paid plan). On a
# free private repo the `configure-pages` step fails with a clear permissions
# error — make the repo public (Settings → General → Change visibility).
#
# The backend URL is injected from the repository Actions VARIABLE `API_URL`
# (Settings → Secrets and variables → Actions → Variables). If unset, the game
# builds in offline-leaderboard mode and is still fully playable.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/ai-datacenter-simulator-teaching-o8udoe
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'

# Permissions required by the official Pages deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enables Pages on the repo (if needed) and configures the build env.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build web (PWA)
        env:
          # Project-pages subpath; must match the repo name.
          VITE_BASE: /At-Data-center-Sim/
          # Live backend URL (optional). Set repo variable API_URL to enable.
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build -w web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
